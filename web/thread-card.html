<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Thread Card Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Noto Sans KR', sans-serif; }
  html,body { width:1080px; height:1350px; background:#000; }
  #card { width:1080px; height:1350px; position:relative; overflow:hidden; background:#000; color:#fff; }

  /* ===== Card type: title ===== */
  #card.title { background: radial-gradient(circle at 20% 0%, #0f2018 0%, #000 60%); background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px, 40px 40px; padding:64px 72px; }
  .row-top { display:flex; justify-content:space-between; align-items:center; }
  .date { font-size:28px; color:#9c9284; font-weight:700; letter-spacing:0.05em; }
  .pill { background:#65b282; color:#0a1410; font-weight:900; font-size:24px; padding:8px 22px; border-radius:24px; letter-spacing:0.05em; }
  .headline { font-size:46px; font-weight:900; line-height:1.35; margin-top:56px; white-space:pre-line; }
  .big-pct { font-size:150px; font-weight:900; margin-top:40px; line-height:1; }
  .big-pct.up { color:#65e0a0; }
  .big-pct.down { color:#ff8a8a; }
  .sub { font-size:28px; color:#9c9284; margin-top:16px; font-weight:700; }
  .stats { margin-top:64px; }
  .stat-row { display:flex; justify-content:space-between; padding:22px 0; border-bottom:1px solid rgba(255,255,255,0.12); font-size:30px; }
  .stat-row .k { color:#9c9284; font-weight:700; }
  .stat-row .v { color:#fff; font-weight:900; }
  .footer { position:absolute; bottom:56px; left:72px; font-size:26px; color:#6b6355; font-weight:700; }

  /* ===== Card type: story (list layout) ===== */
  #card.story { background:#000; padding:0; }
  .top-bar { height:14px; background:linear-gradient(90deg,#fbbf24,#65b282); }
  .content { padding:56px 72px; }
  .label { font-size:30px; font-weight:900; letter-spacing:0.08em; color:#f5a623; }
  .headline2 { font-size:44px; font-weight:900; line-height:1.35; margin-top:28px; white-space:pre-line; }
  .list { margin-top:56px; }
  .list-item { display:flex; justify-content:space-between; align-items:baseline; padding:26px 0; border-bottom:1px solid rgba(255,255,255,0.16); }
  .list-item .name { font-size:34px; font-weight:800; color:#fff; }
  .list-item .val { font-size:38px; font-weight:900; }
  .val.up { color:#65e0a0; }
  .val.down { color:#ff8a8a; }
  .insight { margin-top:48px; font-size:28px; color:#c9c2b4; line-height:1.6; }
  .site { margin-top:20px; font-size:26px; color:#6b6355; font-weight:700; }

  /* ===== Card type: movers (3x3 colored grid) ===== */
  #card.movers { background:#000; padding:56px 60px; }
  .movers-title { font-size:38px; font-weight:900; letter-spacing:0.04em; margin-bottom:36px; }
  .movers-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .movers-cell { border-radius:20px; padding:36px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; min-height:170px; }
  .movers-cell .mn { font-size:30px; font-weight:800; color:#fff; }
  .movers-cell .mv { font-size:36px; font-weight:900; }
  .movers-footer { margin-top:40px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:12px; }
  .movers-extra { font-size:24px; color:#9c9284; font-weight:600; }
  .movers-site { font-size:26px; color:#65e0a0; font-weight:900; }

  /* ===== Card type: sectors (12-cell grid, best/worst highlight) ===== */
  #card.sectors { padding:56px 60px; }
  .sector-title { font-size:36px; font-weight:900; margin-bottom:40px; }
  .sector-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .sector-cell { background:#0d0d0d; border:2px solid rgba(255,255,255,0.08); border-radius:14px; padding:28px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; min-height:120px; }
  .sector-cell.best { border-color:#22c55e; }
  .sector-cell.worst { border-color:#ff6b6b; }
  .sector-cell .sn { font-size:24px; font-weight:700; color:#e5ded0; }
  .sector-cell .sv { font-size:30px; font-weight:900; }
  .sector-footer { margin-top:40px; font-size:26px; color:#9c9284; font-weight:600; }

  /* ===== Card type: closing (LIVE NOW) ===== */
  #card.closing { background: radial-gradient(circle at 80% 100%, #0f2018 0%, #000 55%); padding:64px 72px; display:flex; flex-direction:column; justify-content:space-between; }
  .live-badge { display:inline-flex; align-items:center; gap:12px; font-size:26px; font-weight:900; color:#65e0a0; letter-spacing:0.08em; }
  .live-dot { width:14px; height:14px; border-radius:50%; background:#65e0a0; }
  .closing-title { font-size:52px; font-weight:900; margin-top:36px; line-height:1.3; }
  .closing-q { font-size:32px; color:#e5ded0; margin-top:32px; line-height:1.6; font-weight:700; }
  .closing-cta { font-size:34px; font-weight:900; color:#fbbf24; margin-top:auto; }
  .closing-url { font-size:28px; color:#9c9284; margin-top:12px; font-weight:700; }
</style>
</head>
<body>
  <div id="card"></div>
<script>
function qs(name){ const u=new URL(location.href); return u.searchParams.get(name); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderCard(){
  const type = qs('type') || 'title';
  const card = document.getElementById('card');
  card.className = type;
  const data = JSON.parse(decodeURIComponent(qs('data') || '{}'));

  if(type === 'title'){
    const isUp = data.pct >= 0;
    card.innerHTML = `
      <div class="row-top">
        <div class="date">${esc(data.date)}</div>
        <div class="pill">${esc(data.dayLabel)}</div>
      </div>
      <div class="headline">${esc(data.headline)}</div>
      <div class="big-pct ${isUp?'up':'down'}">${isUp?'+':''}${data.pct.toFixed(2)}%</div>
      <div class="sub">KOSPI200 가중평균 등락률</div>
      <div class="stats">
        <div class="stat-row"><span class="k">시가총액</span><span class="v">${esc(data.marketCap)}</span></div>
        <div class="stat-row"><span class="k">종목수</span><span class="v">${data.stockCount}</span></div>
        <div class="stat-row"><span class="k">섹터 동향</span><span class="v">${data.sectorUp}↑ / ${data.sectorDown}↓</span></div>
      </div>
      <div class="footer">koreaheatmap.com</div>
    `;
  } else if(type === 'story'){
    const items = data.items.map(it => `
      <div class="list-item">
        <span class="name">${esc(it.name)}</span>
        <span class="val ${it.value>=0?'up':'down'}">${it.value>=0?'+':''}${it.value.toFixed(2)}%</span>
      </div>
    `).join('');
    card.innerHTML = `
      <div class="top-bar"></div>
      <div class="content">
        <div class="label">${esc(data.label)}</div>
        <div class="headline2">${esc(data.headline)}</div>
        <div class="list">${items}</div>
        <div class="insight">${esc(data.insight)}</div>
        <div class="site">koreaheatmap.com</div>
      </div>
    `;
  } else if(type === 'movers'){
    function moversColor(v){
      if (v < 0) return '#b91c1c';
      if (v >= 6) return '#1fa563';
      if (v >= 4) return '#1c8f56';
      if (v >= 2) return '#19794a';
      return '#155c37';
    }
    const cells = data.items.slice(0,9).map(it => `
      <div class="movers-cell" style="background:${moversColor(it.value)}">
        <span class="mn">${esc(it.name)}</span>
        <span class="mv" style="color:#fff">${it.value>=0?'+':''}${it.value.toFixed(2)}%</span>
      </div>
    `).join('');
    const extraText = (data.extra || []).map(e => `${esc(e.name)} ${e.value>=0?'+':''}${e.value.toFixed(2)}%`).join(' · ');
    card.innerHTML = `
      <div class="movers-title">${esc(data.title || "TODAY'S TOP MOVERS")}</div>
      <div class="movers-grid">${cells}</div>
      <div class="movers-footer">
        <span class="movers-extra">${extraText ? '추가 주목 ' + extraText : ''}</span>
        <span class="movers-site">koreaheatmap.com</span>
      </div>
    `;
  } else if(type === 'sectors'){
    const values = data.sectors.map(s => s.value);
    const maxV = Math.max(...values), minV = Math.min(...values);
    const cells = data.sectors.map(s => {
      const cls = s.value === maxV ? 'best' : (s.value === minV ? 'worst' : '');
      return `
      <div class="sector-cell ${cls}">
        <span class="sn">${esc(s.name)}</span>
        <span class="sv" style="color:${s.value>=0?'#65e0a0':'#ff8a8a'}">${s.value>=0?'+':''}${s.value.toFixed(2)}%</span>
      </div>
    `;
    }).join('');
    card.innerHTML = `
      <div class="sector-title">섹터별 등락률 — ${data.sectorCount}개 전체</div>
      <div class="sector-grid">${cells}</div>
      <div class="sector-footer">${esc(data.insight || '')}</div>
    `;
  } else if(type === 'closing'){
    card.innerHTML = `
      <div>
        <div class="live-badge"><span class="live-dot"></span>LIVE NOW · DAILY HEATMAP</div>
        <div class="closing-title">${esc(data.title)}</div>
        <div class="closing-q">${esc(data.question)}</div>
      </div>
      <div>
        <div class="closing-cta">${esc(data.cta)}</div>
        <div class="closing-url">koreaheatmap.com</div>
      </div>
    `;
  }
}
renderCard();
</script>
</body>
</html>
